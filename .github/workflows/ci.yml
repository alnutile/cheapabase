name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  e2e:
    name: Docker build + end-to-end tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and start the stack
        run: docker compose up -d --build --wait

      - run: bun install --frozen-lockfile

      - name: API tests (supabase-js, RLS, functions, realtime)
        run: bun run test:e2e

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Browser test (docs app, two users)
        run: npm run test:ui

      - name: Stack logs
        if: failure()
        run: docker compose logs

  examples:
    name: Example (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nextjs
            port: 3001
            install: npm ci && npm run build
            start: PORT=3001 npm start
          - name: laravel
            port: 3002
            install: composer install --no-interaction --no-progress && cp .env.example .env && php artisan key:generate --no-interaction
            start: PHP_CLI_SERVER_WORKERS=4 php artisan serve --no-reload --host=127.0.0.1 --port=3002
          - name: fastapi
            port: 3003
            install: uv sync --frozen
            start: uv run uvicorn app.main:app --host 127.0.0.1 --port 3003
          - name: rails
            port: 3004
            install: bundle install
            start: bin/rails server -b 127.0.0.1 -p 3004
    defaults:
      run:
        working-directory: examples/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: matrix.name == 'laravel'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - if: matrix.name == 'fastapi'
        uses: astral-sh/setup-uv@v6
        with:
          # The example keeps `uv run` alive until the job ends, so the post-job cache
          # prune would wait 5 minutes on its lock and fail the job.
          enable-cache: false
      - if: matrix.name == 'rails'
        uses: ruby/setup-ruby@v1
        with:
          working-directory: examples/rails
          bundler-cache: true

      - name: Start cheapabase
        working-directory: .
        run: docker compose up -d --build --wait

      - name: Install the example
        run: ${{ matrix.install }}

      - name: Start the example
        run: |
          nohup sh -c '${{ matrix.start }}' > /tmp/example.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:${{ matrix.port }}/ && exit 0
            sleep 1
          done
          echo "example did not start"; cat /tmp/example.log; exit 1

      - name: Smoke test (auth, functions, RLS, realtime)
        working-directory: .
        run: |
          bun install --frozen-lockfile
          npx playwright-core install --with-deps chromium
          node examples/smoke.mjs http://127.0.0.1:${{ matrix.port }}

      - name: Laravel collaboration (sharing, autosave, presence, permissions)
        if: matrix.name == 'laravel'
        working-directory: .
        run: node test/ui/laravel-collaboration.mjs

      - name: Collaboration failure logs
        if: failure()
        working-directory: .
        run: |
          cat /tmp/example.log || true
          docker compose logs
